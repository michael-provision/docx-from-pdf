name: publish

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/docx-from-pdf
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$VERSION" > version.txt
          cat version.txt

      - name: Build package
        run: uv build --clear

      - name: Check package
        run: uvx twine check dist/*

      - name: Smoke install package
        run: |
          uv venv /tmp/docx-from-pdf-smoke
          uv pip install --python /tmp/docx-from-pdf-smoke/bin/python dist/*.whl
          /tmp/docx-from-pdf-smoke/bin/python -c "from docx_from_pdf import Converter, parse; print(Converter.__name__, parse.__name__)"
          /tmp/docx-from-pdf-smoke/bin/docx-from-pdf --help

      - name: Publish package
        run: uv publish --trusted-publishing always
